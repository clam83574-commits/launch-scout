# Директ, комментарии под постами Скаута и ответы на его комментарии (social_inbox.py).
# Запускает Worker в 11:00 и 20:00 по Астане (TH_INBOX_H); /threads inbox test — без отправки.
name: inbox

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "true — разобрать без отправки ответов"
        default: "false"

concurrency:
  group: inbox

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LS_INGEST_SECRET: ${{ secrets.LS_INGEST_SECRET }}
      WORKER_URL: https://launch-scout-bot.clam83574.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: python -m playwright install --with-deps chromium
      # Куки аккаунтов Скаута и ключи моделей — только в этом шаге; тексты сообщений в лог не пишутся.
      - env:
          TH_COOKIES: ${{ secrets.TH_COOKIES }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          X_SCOUT_COOKIES: ${{ secrets.X_SCOUT_COOKIES }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          TH_USER: ${{ vars.TH_USER }}
          IG_USER: ${{ vars.IG_USER }}
          X_USER: ${{ vars.X_USER }}
          DRY: ${{ github.event.inputs.dry }}
        run: python social_inbox.py $([ "$DRY" = true ] && echo --dry)
