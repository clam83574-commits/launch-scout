# Сбор свежих запусков на GitHub Actions — чтобы ноутбук можно было закрыть.
#
# КУДА ПОЛОЖИТЬ: в репозитории launch-scout это файл
#   .github/workflows/scout.yml
# (GitHub видит workflow только в корне репозитория, не в подпапке).
#
# КТО ЗАПУСКАЕТ. Основные часы — Cloudflare Worker: каждые 10 минут он
# вызывает workflow_dispatch с digest=auto. Собственное расписание GitHub
# ниже оставлено только страховкой на случай, если Worker замолчит: как
# часы оно не годится. При cron «каждые 10 минут» GitHub за 115 часов
# выполнил 31 прогон из 688 — 5%, медиана раз в четыре часа, без единой
# ошибки в логах (замерено 2026-09-25). Скорость набора реакций по двум
# замерам с разрывом в четыре часа не считается, а условие сводки
# «прогон попал в 07:00–07:15» не выполнилось ни разу — бот пять дней
# не прислал ни одного сообщения.
#
# ПРО ДЕНЬГИ. Частый запуск возможен потому, что репозиторий ПУБЛИЧНЫЙ:
# на публичных Actions не лимитированы. Если его закроют обратно — частоту
# в Worker снизить до 30 минут, иначе лимит 2000 минут выгорит за две
# недели и встанут ОБА продукта, включая tm-scout: лимит общий на аккаунт.
#
# ПРО БАЗУ. Она живёт в кэше Actions и переносится из прогона в прогон по
# restore-keys. Без неё каждый запуск считал бы все записи новыми, а
# скорость набора лайков не считалась бы вовсе.

name: scout

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Источники через запятую (x,hn,yc,gh)"
        default: "x,hn,yc,gh"
      digest:
        description: "Сводка: auto — если пришло время, yes — сейчас, no — не слать"
        default: "auto"
      top:
        description: "Прислать N лучших прямо сейчас (пусто = не слать)"
        default: ""

# Два прогона одновременно писали бы в одну базу и мешали друг другу.
# Лишний тик встаёт в очередь, а не отменяет идущий прогон.
concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Секреты подняты на уровень job СПЕЦИАЛЬНО: в `if:` шага контекст env
    # видит только переменные job, а не объявленные внутри самого шага —
    # объявленный в шаге секрет в его же условии всегда пуст, и шаг молча
    # не выполнялся бы никогда (урок tm-scout).
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      # Встроенный токен раннера: снимает лимит GitHub API (60 запросов в
      # час на адрес) без заведения личного токена.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LS_INGEST_SECRET: ${{ secrets.LS_INGEST_SECRET }}
      # ИИ: Groq, бесплатный тариф — выжимки, вердикт «продукт ли это»,
      # темы для трендов. Без ключа шаг молча пропускается.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LS_LANG: ru
      WORKER_URL: https://launch-scout-bot.clam83574.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      # Ключ уникален для прогона, а restore-keys подхватывает последнюю
      # сохранённую базу: так кэш обновляется каждый раз, а не залипает
      # на первой версии (кэш в Actions неизменяем после записи).
      - name: Забрать базу прошлого прогона
        uses: actions/cache@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-

      - name: Проверить, пускает ли X с раннера
        # Диагностика, а не сбор: с адресов дата-центров X ведёт себя иначе,
        # чем с домашнего, и это надо ЗНАТЬ, а не предполагать. Шаг никогда
        # не роняет прогон — он только пишет вердикт в лог.
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 \
            -X POST "https://api.x.com/1.1/guest/activate.json" \
            -H "Authorization: Bearer AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA" || echo "000")
          syn=$(curl -s -o /dev/null -w "%{http_code}" -m 20 \
            "https://cdn.syndication.twimg.com/tweet-result?id=20&lang=en&token=a" || echo "000")
          echo "guest/activate: $code | syndication: $syn"
          if [ "$code" = "200" ] && [ "$syn" = "200" ]; then
            echo "::notice::X отвечает с раннера GitHub (guest $code, syndication $syn)"
          else
            echo "::warning::X с раннера отвечает не как с домашнего адреса (guest $code, syndication $syn)"
          fi

      - name: Прогон
        env:
          SOURCES: ${{ github.event.inputs.sources || 'x,hn,yc,gh' }}
          DIGEST: ${{ github.event.inputs.digest || 'auto' }}
        run: |
          ARGS="--sources $SOURCES"
          # auto — сводка уйдёт, если сейчас её окно и с прошлой прошло не
          # меньше 10 часов (решает scout.py по памяти в базе, а не по
          # минуте запуска — минута при неровном расписании не попадается).
          case "$DIGEST" in
            yes)  ARGS="$ARGS --digest" ;;
            auto) ARGS="$ARGS --digest-auto" ;;
          esac
          echo "запускаю: scout.py $ARGS"
          python scout.py $ARGS

      - name: Прислать топ по требованию
        if: ${{ github.event.inputs.top != '' && github.event.inputs.top != null }}
        run: python scout.py --top ${{ github.event.inputs.top }}

      # Кнопки в Telegram читают срез в D1, а не эту базу. Срез уходит
      # в сам Worker одним запросом — токен Cloudflare в GitHub не нужен.
      - name: Отдать срез боту
        if: ${{ env.LS_INGEST_SECRET != '' }}
        run: |
          python export_d1.py --json out/snapshot.json
          code=$(curl -s -o out/ingest.txt -w "%{http_code}" -m 60 \
            -X POST "$WORKER_URL/ingest" \
            -H "x-ingest-secret: $LS_INGEST_SECRET" \
            -H "content-type: application/json" \
            --data-binary @out/snapshot.json)
          echo "Worker ответил $code: $(cat out/ingest.txt)"
          [ "$code" = "200" ] || { echo "::error::срез не принят ($code)"; exit 1; }

      - name: Предупредить, если бот не обновляется
        if: ${{ env.LS_INGEST_SECRET == '' }}
        run: echo "::warning::Секрет LS_INGEST_SECRET не задан — сбор идёт, но кнопки покажут прошлые находки"

      - name: Что в базе
        if: always()
        run: python scout.py --status || true

      - name: Сохранить лог прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-log-${{ github.run_id }}
          path: data/scout.log
          retention-days: 7
          if-no-files-found: ignore
