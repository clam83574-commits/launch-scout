<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* PDF-досье Launch Scout (dossier.py): A4, обложка под обрез, дальше поля под номер страницы. */
:root { --ink: #0f1d3a; --muted: #56647f; --line: #e6ecf5; --line-2: #c9d5ea; --blue: #1d4fd8; --blue-2: #5b84f0; --blue-soft: #eaf0fd; --warm: #fff6e6; }
@page { size: A4; margin: 14mm 0 16mm; }
@page :first { margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 10pt/1.5 "Golos Text", Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.wrap { padding: 0 18mm; }
b { font-weight: 600; }
a { color: var(--blue); text-decoration: none; }
.mono { font: 500 7.5pt "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }

/* ---------- обложка ---------- */
.cover { height: 297mm; position: relative; overflow: hidden; background: var(--ink); color: #fff; page-break-after: always;
  background-image: linear-gradient(rgba(255,255,255,.05) .3mm, transparent .3mm), linear-gradient(90deg, rgba(255,255,255,.05) .3mm, transparent .3mm); background-size: 8mm 8mm; }
.cover .glow { position: absolute; right: -60mm; top: -50mm; width: 200mm; height: 200mm; border-radius: 50%; background: radial-gradient(circle, rgba(29,79,216,.6), transparent 65%); }
.cover .brand { position: absolute; left: 20mm; top: 20mm; display: flex; align-items: center; gap: 3mm; font: 500 12pt "Unbounded", sans-serif; }
.cover .brand svg { width: 9mm; height: 9mm; }
.cover .kind { position: absolute; left: 20mm; top: 92mm; color: #9fb4e8; }
.cover h1 { position: absolute; left: 20mm; right: 20mm; top: 102mm; font: 700 30pt/1.08 "Unbounded", sans-serif; letter-spacing: -.03em; }
.cover .sub { position: absolute; left: 20mm; right: 34mm; top: 172mm; font-size: 13pt; line-height: 1.4; color: #c9d5ea; }
.cover .foot { position: absolute; left: 20mm; right: 20mm; bottom: 20mm; display: flex; justify-content: space-between; align-items: flex-end; border-top: .3mm solid rgba(255,255,255,.18); padding-top: 5mm; font-size: 9pt; color: #9fb4e8; }
.cover .foot b { display: block; color: #fff; font-size: 10.5pt; margin-top: 1mm; }
.cover .sub sup.fn a { color: #9fb4e8; }

/* ---------- сводка ---------- */
.intro { page-break-after: always; padding-top: 4mm; }
h3 { font: 500 7.5pt "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin: 0 0 3mm; }
.summary { list-style: none; counter-reset: s; display: grid; gap: 2.5mm; margin-bottom: 8mm; }
.summary li { counter-increment: s; position: relative; padding: 3mm 4mm 3mm 13mm; border: .3mm solid var(--line-2); border-radius: 2.5mm; font-size: 10.5pt; }
.summary li::before { content: counter(s); position: absolute; left: 4mm; top: 2.6mm; font: 700 11pt "Unbounded", sans-serif; color: var(--blue); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; margin-bottom: 8mm; }
.kpi { background: var(--blue-soft); border-radius: 2.5mm; padding: 4mm; display: flex; flex-direction: column; gap: 1.5mm; }
.kpi b { font: 700 15pt/1.05 "Unbounded", sans-serif; letter-spacing: -.02em; }
.kpi span { font-size: 8.5pt; color: var(--muted); line-height: 1.3; }
.toc { list-style: none; counter-reset: t; border-top: .3mm solid var(--line-2); }
.toc li { counter-increment: t; padding: 2.6mm 0 2.6mm 11mm; border-bottom: .3mm solid var(--line); position: relative; font-size: 10.5pt; }
.toc li::before { content: counter(t, decimal-leading-zero); position: absolute; left: 0; top: 2.9mm; font: 500 8.5pt "JetBrains Mono", monospace; color: var(--muted); }
.toc li.key { font-weight: 600; color: var(--blue); }
.toc li.key::after { content: " 🔑"; }

/* ---------- разделы ---------- */
.sec { padding-top: 2mm; margin-bottom: 10mm; }
.sec + .sec { margin-top: 12mm; }
.sec.key { page-break-before: always; }
h2, .sec .num { page-break-after: avoid; }
.sec .num { font: 700 34pt/1 "Unbounded", sans-serif; color: var(--line-2); letter-spacing: -.04em; }
.sec h2 { font: 700 17pt/1.15 "Unbounded", sans-serif; letter-spacing: -.02em; margin: 2mm 0 3mm; }
.sec .lead { font-size: 11.5pt; color: var(--muted); margin-bottom: 5mm; }
.sec p { margin-bottom: 3.5mm; }
.sec ul { margin: 0 0 4mm 5mm; }
.sec ul li { margin-bottom: 1.6mm; padding-left: 1mm; }
.sec.key { border-left: 1.2mm solid var(--blue); padding-left: 6mm; margin-left: -7.2mm; }
.sec.key .num { color: var(--blue-2); }
.badge { display: inline-block; background: var(--blue); color: #fff; font: 500 7.5pt "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; padding: 1.2mm 2.6mm; border-radius: 1.2mm; margin-bottom: 3mm; }
.callout { background: var(--warm); border-left: 1mm solid #f0a020; border-radius: 0 2mm 2mm 0; padding: 3.5mm 4.5mm; margin: 4mm 0; font-weight: 500; }
table { width: 100%; border-collapse: collapse; margin: 3mm 0 5mm; font-size: 9pt; page-break-inside: auto; }
th { text-align: left; font-weight: 600; background: var(--ink); color: #fff; padding: 2.2mm 2.6mm; }
th:first-child { border-radius: 1.5mm 0 0 0; } th:last-child { border-radius: 0 1.5mm 0 0; }
td { padding: 2.2mm 2.6mm; border-bottom: .3mm solid var(--line); vertical-align: top; }
tr { page-break-inside: avoid; }
tbody tr:nth-child(even) td { background: #f7f9fd; }
.steps { position: relative; margin: 3mm 0 5mm; }
.step { display: grid; grid-template-columns: 30mm 1fr; gap: 4mm; padding: 0 0 4mm; position: relative; page-break-inside: avoid; }
.step::before { content: ""; position: absolute; left: 26.6mm; top: 1.6mm; width: 2.6mm; height: 2.6mm; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1mm var(--blue-soft); }
.step::after { content: ""; position: absolute; left: 27.75mm; top: 5mm; bottom: 0; width: .3mm; background: var(--line-2); }
.step:last-child::after { display: none; }
.step .when { font: 500 8pt "JetBrains Mono", monospace; color: var(--blue); padding-right: 5mm; letter-spacing: .04em; }
.step .what { padding-left: 3mm; }
.step .metric { font-size: 8.5pt; color: var(--muted); margin-top: 1mm; }

/* ---------- сноски ---------- */
sup.fn { font-size: 6.5pt; line-height: 0; margin-left: .3mm; }
sup.fn a { color: var(--blue); font-weight: 600; }
sup.fn + sup.fn::before { content: ","; color: var(--blue); }
.notes { margin-top: 6mm; padding-top: 3mm; border-top: .3mm solid var(--line-2); font-size: 7.5pt; line-height: 1.4; color: var(--muted); page-break-inside: auto; }
.notes b { font: 500 6.5pt "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.notes ol { margin: 1.5mm 0 0 5mm; }
.notes li { margin-bottom: .8mm; page-break-inside: avoid; }
.notes li a { font-weight: 600; }

/* ---------- финал ---------- */
.final { page-break-before: always; padding-top: 4mm; }
.next { list-style: none; counter-reset: x; display: grid; gap: 3mm; margin-bottom: 8mm; }
.next li { counter-increment: x; background: var(--ink); color: #fff; border-radius: 2.5mm; padding: 4mm 5mm 4mm 15mm; position: relative; font-size: 10.5pt; }
.next li::before { content: counter(x); position: absolute; left: 5mm; top: 3.4mm; font: 700 12pt "Unbounded", sans-serif; color: var(--blue-2); }
.next li sup.fn a { color: #9fb4e8; }
.method { font-size: 8pt; color: var(--muted); border-top: .3mm solid var(--line-2); padding-top: 3mm; }
</style>
</head>
<body>
<div class="cover">
  <div class="glow"></div>
  <div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 16 L27 8.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="22.6" cy="11.4" r="2.6" fill="#5b84f0"/></svg>Launch Scout</div>
  <div class="kind mono">PDF · __MARKET__</div>
  <h1>__TITLE__</h1>
  <div class="sub">__SUBTITLE__</div>
  <div class="foot"><div>__FOR__<b>__DATE__</b></div></div>
</div>

<div class="wrap">
  <div class="intro">
    <h3>__L_SUMMARY__</h3>
    <ol class="summary">__SUMMARY__</ol>
    <h3>__L_KPIS__</h3>
    <div class="kpis">__KPIS__</div>
    <h3>__L_TOC__</h3>
    <ol class="toc">__TOC__</ol>
    __INTRO_NOTES__
  </div>

  __SECTIONS__

  <div class="final">
    <h3>__L_NEXT__</h3>
    <ol class="next">__NEXT__</ol>
    __NEXT_NOTES__
    <p class="method">__METHOD__</p>
  </div>
</div>
</body>
</html>
