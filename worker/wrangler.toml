name = "launch-scout-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Аккаунт указан явно. Без него wrangler на этой машине уходит в чужой
# account id и отвечает «Authentication error [code: 10000]» — при том что
# права в токене есть, а `whoami` показывает совсем другой аккаунт
# (замерено 2026-09-20).
account_id = "21869b3e20e58e47ff17e4b4b34944a5"

[[d1_databases]]
binding = "DB"
database_name = "launch-scout"
database_id = "b4aee1b4-a562-4767-b5ed-11f7b764b1fe"

[vars]
# Кому отвечать: Telegram id через запятую. ПУСТО = отвечает всем подряд,
# а бота может найти в поиске кто угодно — поэтому здесь всегда должен
# стоять id владельца.
LS_BOT_ALLOW = "6918708510"

# Секреты ставятся отдельно (`wrangler secret put`), в файл не попадают:
#   LS_BOT_TOKEN      - токен от @BotFather
#   LS_WEBHOOK_SECRET - произвольная строка, ею Telegram подписывает каждый
#                       запрос; без неё в Worker может постучаться кто угодно

# Часы для всего скаута: каждые 10 минут Worker запускает прогон в GitHub
# Actions через workflow_dispatch и проверяет, что прошлые доходят.
# Собственное расписание GitHub тут не годится — оно выполняло 5% прогонов
# (31 из 688 за 115 часов, замерено 2026-09-25).
[triggers]
crons = ["*/10 * * * *"]

# Секреты этого Worker (ставятся `wrangler secret put`, в файле их нет):
#   LS_BOT_TOKEN       - токен бота
#   LS_WEBHOOK_SECRET  - подпись вебхука Telegram
#   LS_ACCESS_CODE     - код доступа для друзей
#   LS_INGEST_SECRET   - подпись среза, который присылает GitHub Actions
#   LS_GH_TOKEN        - fine-grained токен GitHub ТОЛЬКО на этот репозиторий,
#                        право Actions: Read and write — чтобы запускать прогоны
