<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>launch-scout</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета интерфейса берутся из темы Telegram (он сам выставляет эти
     переменные), запасные значения — для просмотра в обычном браузере. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #6b6b70);
    --link: var(--tg-theme-link-color, #2a78d6);
    --btn: var(--tg-theme-button-color, #2a78d6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    /* Палитра графиков: первые три слота проверенной палитры, прогнаны
       validate_palette.js на фонах Telegram #ffffff / #212121 / #17212b —
       все проверки пройдены. Бирюзовый на белом 2.82:1, поэтому у графика
       всегда подписанная легенда и вид «таблицей». */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s-other: #9a9994;
    --hot: #d03b3b;
  }
  /* Тёмная тема: цвета серий — тёмные шаги той же палитры (проверены на
     #212121 и #17212b), запасной фон — тёмно-синий Telegram. */
  :root[data-theme="dark"] {
    --bg: var(--tg-theme-bg-color, #17212b);
    --bg2: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b98a5);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #5288c1);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-other: #6f6e69;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  body { padding: 0 0 calc(64px + env(safe-area-inset-bottom)); }
  button { font: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 14px 8px;
    border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    border-radius: 16px; padding: 5px 11px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .seg { display: inline-flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg2); font-weight: 600; }
  /* Аудитория — переключатели: выбранный залит цветом кнопки, повторное
     нажатие снимает фильтр. Ничего не выбрано — показываются все. */
  #aud button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
  .seg.wide { display: flex; width: 100%; }
  .seg.wide button { flex: 1; padding: 9px 6px; font-size: 14px; }
  main { padding: 8px 14px; }
  .card { background: var(--bg2); border-radius: 12px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
  .card h3 { margin: 0 0 3px; font-size: 15px; line-height: 1.3; }
  .meta { color: var(--hint); font-size: 12.5px; }
  .sum { margin: 5px 0 0; font-size: 14px; }
  .score { float: right; font-variant-numeric: tabular-nums; color: var(--hint); font-size: 12.5px; margin-left: 8px; }
  .hot { color: var(--hot); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tag { font-size: 11.5px; line-height: 1; padding: 4px 7px; border-radius: 8px; border: 1px solid var(--line); color: var(--hint); }
  .tag.aud { border-color: transparent; background: color-mix(in srgb, var(--btn) 18%, transparent); color: var(--text); font-weight: 600; }
  .empty { color: var(--hint); text-align: center; padding: 40px 16px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--bg);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: transparent; color: var(--hint); padding: 6px 0 8px; font-size: 11.5px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
  nav button i { font-style: normal; font-size: 19px; line-height: 1.25; filter: grayscale(1); opacity: .65; }
  nav button[aria-current="page"] { color: var(--btn); font-weight: 600; }
  nav button[aria-current="page"] i { filter: none; opacity: 1; }
  section[hidden] { display: none; }
  .hero { display: flex; gap: 10px; margin: 6px 0 4px; }
  .hero div { flex: 1; background: var(--bg2); border-radius: 12px; padding: 10px 12px; }
  .hero b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .hero span { color: var(--hint); font-size: 12.5px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .note { color: var(--hint); font-size: 12.5px; margin: 2px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; margin: 6px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chart { position: relative; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px;
    border-radius: 8px; padding: 6px 8px; white-space: nowrap; transform: translate(-50%, -100%); display: none; }
  .linkbtn { border: 0; background: none; color: var(--link); padding: 4px 0; font-size: 13px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .bars .bar { display: grid; grid-template-columns: 38% 1fr auto; gap: 8px; align-items: center;
    padding: 5px 0; cursor: pointer; font-size: 13.5px; }
  .bars .track { height: 10px; background: color-mix(in srgb, var(--hint) 12%, transparent); border-radius: 0 4px 4px 0; }
  .bars .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
  .bars .val { color: var(--hint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  /* 🧭 Рынок: плитки, графики, ниши — минимум текста */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 6px 0 4px; }
  .kpi { background: var(--bg2); border-radius: 12px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi span { color: var(--hint); font-size: 12px; }
  .kpi small { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--hint); }
  .mk h2 { font-size: 15px; margin: 18px 0 2px; }
  .mk .sub { color: var(--hint); font-size: 12px; margin-bottom: 6px; }
  .mk svg { display: block; width: 100%; overflow: visible; }
  .mk svg text { fill: var(--hint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mk svg .lbl { fill: var(--text); font-size: 12px; }
  .mk svg .hit { fill: transparent; cursor: pointer; }
  .stack { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .stack i { display: block; height: 100%; }
  .niches { display: grid; gap: 8px; }
  .niche { background: var(--bg2); border-radius: 12px; padding: 10px 12px; }
  .niche .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .niche .top b { font-size: 14px; }
  .niche .top em { font-style: normal; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .niche .top em small { font-size: 12px; font-weight: 400; color: var(--hint); }
  .niche .who b { color: var(--text); font-weight: 600; }
  .niche .row { font-size: 12.5px; margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .niche .row a { color: var(--link); text-decoration: none; }
  .niche .spark { margin-top: 6px; }
  .niche .follow { margin-top: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .niche .follow.on { background: color-mix(in srgb, var(--s1) 16%, var(--bg)); border-color: var(--s1); }
  .niche .who { color: var(--hint); font-size: 12px; margin-top: 4px; }
  .niche .who a { color: var(--link); text-decoration: none; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .story { white-space: pre-wrap; background: var(--bg2); border-radius: 12px; padding: 10px 12px; }
  .story.market { white-space: normal; margin-bottom: 14px; line-height: 1.45; }
  .story a { color: var(--link); }
  dialog { border: 0; border-radius: 16px 16px 0 0; padding: 0; width: 100%; max-width: 640px; margin: auto auto 0;
    background: var(--bg); color: var(--text); max-height: 88vh; }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .dlg { padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 88vh; }
  .dlg h3 { margin: 0 34px 4px 0; font-size: 17px; }
  .x { position: absolute; top: 10px; right: 12px; border: 0; background: var(--bg2); color: var(--text);
    width: 30px; height: 30px; border-radius: 15px; font-size: 16px; }
  .kv { margin: 10px 0; }
  .kv div { margin: 4px 0; }
  /* Пост и сайт проекта — крупными кнопками: мелкие ссылки текстом в
     конце окна не замечали (отзыв владельца 2026-09-27). */
  .lrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
  .lbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
    min-height: 54px; padding: 8px 10px; border-radius: 12px; text-decoration: none; text-align: center; color: var(--text);
    background: color-mix(in srgb, var(--btn) 12%, var(--bg)); border: 1.5px solid color-mix(in srgb, var(--btn) 50%, transparent); }
  .lbtn span { font-weight: 600; font-size: 15px; }
  .lbtn small { color: var(--hint); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbtn:active { transform: scale(.98); }
  .primary { width: 100%; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-text);
    padding: 12px; font-size: 15px; font-weight: 600; margin-top: 12px; cursor: pointer; }
  .why { color: var(--hint); font-size: 12.5px; margin-top: 8px; }
  .secondary { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); color: var(--text);
    padding: 11px; font-size: 15px; margin-top: 8px; cursor: pointer; }
  .idea { margin-top: 12px; }
  .idea h4 { margin: 12px 0 4px; font-size: 14px; }
  .idea ul { margin: 4px 0; padding-left: 18px; }
  details.orig { margin-top: 14px; color: var(--hint); font-size: 13.5px; }
  details.orig summary { cursor: pointer; padding: 6px 0; }
  details.orig p { margin: 4px 0 0; white-space: pre-wrap; color: var(--text); }
  .pref { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .pref input { width: 20px; height: 20px; accent-color: var(--btn); flex: 0 0 auto; }
  /* Переключатель уведомления: подпись слева, тумблер справа. */
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sw b { font-weight: 500; }
  .sw small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 1px; }
  .sw input { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 46px; height: 28px; margin: 0; border-radius: 14px;
    background: color-mix(in srgb, var(--hint) 40%, transparent); position: relative; cursor: pointer; transition: background .15s; }
  .sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .15s; }
  .sw input:checked { background: var(--btn); }
  .sw input:checked::after { transform: translateX(18px); }
  .sw input:focus-visible, .pref input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  #toast { position: fixed; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom)); z-index: 30; pointer-events: none;
    transform: translate(-50%, 8px); opacity: 0; transition: opacity .2s, transform .2s;
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 18px; font-size: 14px; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* Первый вход: язык выбирается до всего остального. */
  #gate { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center;
    justify-content: center; padding: 24px 20px; }
  #gate[hidden] { display: none; }
  .gate-in { width: 100%; max-width: 360px; text-align: center; }
  .gate-in .logo { font-weight: 700; font-size: 20px; margin-bottom: 20px; }
  .gate-in h1 { font-size: 19px; margin: 0 0 18px; line-height: 1.35; }
  .gate-in h1 span { display: block; color: var(--hint); font-size: 14px; font-weight: 400; margin-top: 4px; }
  .gate-in button { display: block; width: 100%; margin: 10px 0; padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer;
    border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg2); color: var(--text); }
  .gate-in button:active { background: var(--btn); color: var(--btn-text); }
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="gate-in">
    <div class="logo">launch-scout</div>
    <h1>Выберите язык<span>Тілді таңдаңыз · Choose your language</span></h1>
    <button data-lang="ru">Русский</button>
    <button data-lang="kk">Қазақша</button>
    <button data-lang="en">English</button>
    <p class="note">Сменить можно в настройках · Баптауларда өзгертуге болады · You can change it in Settings</p>
  </div>
</div>

<header id="hdr">
  <div class="chips" id="cats" role="toolbar"></div>
  <div class="row">
    <div class="seg" id="aud" role="group" aria-label="B2B / B2C / B2G">
      <button data-v="b2b" aria-pressed="false">B2B</button>
      <button data-v="b2c" aria-pressed="false">B2C</button>
      <button data-v="b2g" aria-pressed="false">B2G</button>
    </div>
    <div class="seg" id="sort">
      <button data-v="score" aria-pressed="true" data-t="hot"></button>
      <button data-v="new" aria-pressed="false" data-t="new"></button>
    </div>
    <div class="seg" id="win">
      <button data-v="24" aria-pressed="false" data-t="day"></button>
      <button data-v="168" aria-pressed="true" data-t="week"></button>
    </div>
  </div>
</header>

<main>
  <section id="feed"></section>

  <section id="trends" hidden>
    <div id="marketBlock"></div>
    <!-- Графики «тем среди наших находок» убраны 2026-09-28: это зеркало
         наших фильтров, а не рынка. Узлы оставлены пустыми и скрытыми,
         чтобы не трогать остальной код страницы. -->
    <div hidden>
      <div class="hero" id="hero"></div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="daily"><div class="tip" id="tip"></div></div>
      <button class="linkbtn" id="tableToggle"></button>
      <div id="dailyTable"></div>
      <div class="bars" id="share"></div>
      <div id="risingBlock"></div>
      <div id="newBlock"></div>
      <div id="storyBlock"></div>
    </div>
  </section>

  <section id="saved" hidden></section>

  <section id="settings" hidden></section>
</main>

<nav>
  <button data-tab="feed" aria-current="page"><i aria-hidden="true">📰</i><span data-t="tab_feed"></span></button>
  <button data-tab="trends"><i aria-hidden="true">🧭</i><span data-t="tab_trends"></span></button>
  <button data-tab="saved"><i aria-hidden="true">⭐</i><span data-t="tab_saved"></span></button>
  <button data-tab="settings"><i aria-hidden="true">⚙️</i><span data-t="tab_settings"></span></button>
</nav>

<dialog id="dlg"><button class="x" id="dlgClose" aria-label="✕">✕</button><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const demo = !(tg && tg.initData) && /[?&]demo\b/.test(location.search);
  if (tg) { tg.ready(); tg.expand(); }
  // Внутри Telegram тему сообщает клиент; вне его библиотека всегда
  // отвечает «light», поэтому в браузере берём системную настройку.
  const applyTheme = () => {
    document.documentElement.dataset.theme = tg && tg.initData ? tg.colorScheme
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  };
  applyTheme();
  if (tg && tg.onEvent) tg.onEvent("themeChanged", () => { applyTheme(); if (state.tab === "trends") renderTrends(); });

  // --- языки ---------------------------------------------------------------
  // Казахстан — первый рынок (решение владельца 2026-09-26): русский и
  // казахский, затем английский. Казахские строки — машинный перевод, до
  // продажи в РК показать носителю языка.
  const LANGS = ["ru", "kk", "en"];
  const LANG_LABEL = { ru: "Русский", kk: "Қазақша", en: "English" };
  const T = {
    ru: {
      hot: "Горячие", new: "Новые", day: "Сутки", week: "Неделя", all: "Все",
      tab_feed: "Лента", tab_trends: "Рынок", tab_saved: "В работе", tab_settings: "Настройки",
      subs: "подписчиков", score: "балл", clone: "Повторить",
      effort: { days: "дни", weeks: "недели", months: "месяцы", unclear: "неясно" },
      open_post: "Открыть пост", open_site: "Сайт проекта", orig: "Исходный пост",
      fav_add: "⭐ Взять в работу", fav_on: "✓ В работе", idea_btn: "🧩 Карточка идеи",
      idea_wait: "Ищу аналоги и собираю карточку… ~15 с", idea_net: "Не удалось связаться с сервером — попробуйте ещё раз.",
      idea_fail: "Карточка не собралась.",
      why_now: "⏱ Почему сейчас", who_pays: "💳 Кто платит", analogs: "🇰🇿 Аналоги в Казахстане и СНГ",
      mvp: "🛠 MVP за две недели", risk: "⚠️ Главный риск", loc: "🌍 Под Казахстан",
      shown_of: "Показаны лучшие {shown} из {total} за неделю.",
      empty_feed: "За это окно находок нет. Попробуйте «Неделя».",
      empty_filtered: "С этими фильтрами находок нет. Снимите фильтр или выберите «Неделя».",
      empty_saved: "Здесь будут идеи, которые вы взяли в работу. Откройте находку в ленте и нажмите «Взять в работу».",
      launches_7d: "запусков за 7 дней", of_them_hot: "из них горячих", by_day: "Запуски по дням",
      table_show: "Показать таблицей", table_hide: "Скрыть таблицу", top_week: "Больше всего запусков за неделю",
      tap_topic: "Нажмите на тему — откроется лента по ней.", topics_pending: "Темы ещё проставляются.",
      rising: "Растут", prelim: " (предварительно)", history_note: "История {d} дн. — надёжно после 14.", was: "было",
      new_topics: "Новое, чего нет в привычных темах", story: "🧠 Выводы", other: "прочее", day_col: "День", total_col: "Всего",
      s_lang: "Язык", s_notify: "Уведомления в чате",
      n_brief: "☀️ Сводка дня", n_brief_d: "Одно короткое сообщение: новые стартапы и ниши, куда пошли деньги",
      n_hot: "🔥 Горячие находки — сразу", n_hot_d: "Запуск быстро набирает внимание",

  };
  let S = T.ru;

    if (vars && typeof s === "string") s = s.replace(/\{(\w+)\}/g, (_, n) => (vars[n] !== undefined ? vars[n] : ""));

  const now = () => Date.now() / 1000;
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const haptic = (kind) => { if (tg && tg.HapticFeedback) kind === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(kind); };

  const state = { data: null, cat: null, aud: "", sort: "score", win: 168, tab: "feed", fav: new Map(), lang: "ru",
    prefs: { lang: null, topics: [], audience: [], sectors: [], sources: [], sens: "normal",

  function setLang(l) {
    state.lang = LANGS.includes(l) ? l : "ru";

  async function api(path, opts = {}) {

    if (r.status === 401) throw new Error("auth");

  async function demoApi(path, opts) {

  // --- содержимое на языке читателя ----------------------------------------
  const trends = () => (state.data && state.data.trends) || {};

  // Полный ИИ-разбор ровно на этом языке. Разборы до 2026-09-27 есть только

  function txOf(f, lang = state.lang) {

  function textOf(f) {

  function pool() {
    const cutoff = now() - state.win * 3600, seen = new Set(), out = [];

      if (f.domain) { if (seen.has(f.domain)) continue; seen.add(f.domain); }

  /** Подсказка по наведению и нажатию: любой элемент с data-tip внутри обёртки. */
  function withTip(wrap) {
    const tip = document.createElement("div");
    tip.className = "tip";
    wrap.appendChild(tip);
    const show = (ev) => {
      const t = ev.target.closest("[data-tip]");
      if (!t) { tip.style.display = "none"; return; }
      const r = wrap.getBoundingClientRect(), p = ev.touches ? ev.touches[0] : ev;
      tip.textContent = t.dataset.tip;
      tip.style.display = "block";
      tip.style.left = Math.min(Math.max(p.clientX - r.left, 70), r.width - 70) + "px";
      tip.style.top = (p.clientY - r.top - 8) + "px";
    };
    wrap.addEventListener("pointermove", show);
    wrap.addEventListener("click", show);
    wrap.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  }

  function dailyChart(daily, W) {
    const H = 110, max = Math.max(1, ...daily.map((d) => d.n)), bw = W / daily.length;
    let svg = `<svg viewBox="0 0 ${W} ${H + 16}" height="${H + 16}" role="img" aria-label="${esc(mk("by_day"))}">`;
    svg += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
    daily.forEach((d, i) => {
      const h = Math.max(d.n ? 2 : 0, (d.n / max) * (H - 14)), x = i * bw;
      const label = `${d.d.slice(5)}: ${d.n} ${mk("rounds_w")}, ${usdS(d.usd)}`;
      if (h) svg += `<rect x="${x + 1}" y="${H - h}" width="${Math.max(bw - 2, 1)}" height="${h}" rx="2" fill="var(--s1)"/>`;
      svg += `<rect class="hit" x="${x}" y="0" width="${bw}" height="${H}" data-tip="${esc(label)}"/>`;
    });
    svg += `<text x="0" y="${H + 13}">${esc(daily[0].d.slice(5))}</text><text x="${W}" y="${H + 13}" text-anchor="end">${esc(daily[daily.length - 1].d.slice(5))}</text>`;
    svg += `<text x="${W}" y="10" text-anchor="end">max ${max}</text>`;
    return svg + "</svg>";
  }

  /** Гантели: раунды сектора сейчас (●) против прошлого окна (○). */
  /** Мини-кривая ниши за полгода: одна линия, без осей — форма, а не цифры. */
  function spark(v) {
    const W = 120, H = 24, max = Math.max(1, ...v), n = v.length;
    const pts = v.map((x, i) => `${(i / (n - 1)) * W},${H - (x / max) * (H - 3) - 1.5}`).join(" ");
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" points="${pts}"/></svg>`;
  }

  /** Раунды по неделям за полгода: ранние (синим) под поздними (серым). */
  function weeklyChart(wk, W) {
    const H = 110, n = wk.total.length, max = Math.max(1, ...wk.total), bw = W / n;
    const start = new Date(wk.start + "T00:00:00Z");
    let svg = `<svg viewBox="0 0 ${W} ${H + 16}" height="${H + 16}" role="img" aria-label="${esc(mk("by_week"))}">`;
    svg += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
    wk.total.forEach((t, i) => {
      const e = wk.early[i] || 0, x = i * bw, he = (e / max) * (H - 14), ht = (t / max) * (H - 14);
      const d = new Date(start.getTime() + i * 7 * 86400000).toISOString().slice(5, 10);
      if (ht - he > 0) svg += `<rect x="${x + 1}" y="${H - ht}" width="${Math.max(bw - 2, 1)}" height="${Math.max(ht - he - 2, 0)}" rx="2" fill="var(--s-other)"/>`;
      if (he > 0) svg += `<rect x="${x + 1}" y="${H - he}" width="${Math.max(bw - 2, 1)}" height="${he}" rx="2" fill="var(--s1)"/>`;
      svg += `<rect class="hit" x="${x}" y="0" width="${bw}" height="${H}" data-tip="${esc(`${d}: ${t} ${mk("rounds_w")}, ${mk("early_w")} ${e}`)}"/>`;
    });
    const last = new Date(start.getTime() + (n - 1) * 7 * 86400000).toISOString().slice(5, 10);
    svg += `<text x="0" y="${H + 13}">${esc(wk.start.slice(5))}</text><text x="${W}" y="${H + 13}" text-anchor="end">${esc(last)}</text>`;
    svg += `<text x="${W}" y="10" text-anchor="end">max ${max}</text>`;
    return svg + "</svg>";
  }

  function sectorChart(rep, W) {
    const rows = (rep.sectors || []).filter((s) => (s.money || {}).cur_n || (s.money || {}).prev_n)
      .sort((a, b) => b.money.cur_n - a.money.cur_n).slice(0, 10);
    const max = Math.max(1, ...rows.map((s) => Math.max(s.money.cur_n, s.money.prev_n)));
    const L = Math.min(150, W * 0.42), R = 34, rowH = 26, H = rows.length * rowH;
    const x = (v) => L + (v / max) * (W - L - R);
    let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(mk("sectors"))}">`;
    rows.forEach((s, i) => {
      const y = i * rowH + rowH / 2, m = s.money, meta = sectorList().find((z) => z.id === s.id) || { emoji: "", names: {} };
      const name = `${meta.emoji} ${(meta.names || {})[state.lang] || meta.names.ru || s.id}`;
      const arrow = s.trend === "up" ? " ▲" : s.trend === "down" ? " ▼" : "";
      const tip = `${name}: ${mk("now")} ${m.cur_n} (${mk("early_w")} ${m.cur_early || 0}), ${usdS(m.cur_usd)} · ${mk("before")} ${m.prev_n}, ${usdS(m.prev_usd)}` +
        (s.yc && s.yc.share != null ? ` · YC ${s.yc.share}% (${s.yc.prev}%)` : "");
      svg += `<text class="lbl" x="0" y="${y + 4}">${esc(name.length > 22 ? name.slice(0, 21) + "…" : name)}${arrow}</text>`;
      svg += `<line x1="${x(m.prev_n)}" x2="${x(m.cur_n)}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="2"/>`;
      svg += `<circle cx="${x(m.prev_n)}" cy="${y}" r="4.5" fill="var(--bg)" stroke="var(--s-other)" stroke-width="2"/>`;
      svg += `<circle cx="${x(m.cur_n)}" cy="${y}" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/>`;
      svg += `<text x="${W}" y="${y + 4}" text-anchor="end">${m.cur_n}</text>`;
      svg += `<rect class="hit" x="0" y="${i * rowH}" width="${W}" height="${rowH}" data-tip="${esc(tip)}"/>`;
    });
    return svg + "</svg>";
  }

  function stageBar(stages) {
    const total = STAGES.reduce((a, [k]) => a + (stages[k] || 0), 0);
    if (!total) return "";
    const parts = STAGES.map(([k, label], i) => ({ k, label, n: stages[k] || 0, fill: STAGE_FILL[i] })).filter((p) => p.n);
    return `<div class="stack" role="img" aria-label="${esc(mk("stages"))}">${parts.map((p) =>
      `<i style="flex:${p.n};background:${p.fill}" data-tip="${esc(`${p.label}: ${p.n} (${Math.round(p.n / total * 100)}%)`)}"></i>`).join("")}</div>
      <div class="legend">${parts.map((p) => `<span><i style="background:${p.fill}"></i>${esc(p.label)} ${Math.round(p.n / total * 100)}%</span>`).join("")}</div>`;
  }

  function physChart(hist, W) {
    if (!hist || hist.length < 2) return "";
    const H = 90, max = Math.max(10, ...hist.map((h) => h.share)) * 1.15, n = hist.length;
    const x = (i) => 24 + i * ((W - 48) / (n - 1)), y = (v) => H - (v / max) * (H - 10);
    let svg = `<svg viewBox="0 0 ${W} ${H + 18}" height="${H + 18}" role="img" aria-label="${esc(mk("phys_t"))}">`;
    svg += `<polyline fill="none" stroke="var(--s1)" stroke-width="2" points="${hist.map((h, i) => `${x(i)},${y(h.share)}`).join(" ")}"/>`;
    hist.forEach((h, i) => {
      svg += `<circle cx="${x(i)}" cy="${y(h.share)}" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/>`;
      if (i === n - 1 || i === 0) svg += `<text class="lbl" x="${x(i)}" y="${y(h.share) - 9}" text-anchor="middle">${h.share}%</text>`;
      svg += `<text x="${x(i)}" y="${H + 14}" text-anchor="middle">${esc(batchShort(h.batch))}</text>`;
      svg += `<rect class="hit" x="${x(i) - 20}" y="0" width="40" height="${H}" data-tip="${esc(`${h.batch}: ${h.share}%`)}"/>`;
    });
    return svg + "</svg>";
  }

  // «1 раунд, 2 раунда, 5 раундов»: число без правильного слова читалось криво.
  function roundsWord(n) {
    if (state.lang === "en") return n === 1 ? "round" : "rounds";
    if (state.lang === "kk") return "раунд";
    const d = n % 10, h = n % 100;
    return d === 1 && h !== 11 ? "раунд" : d >= 2 && d <= 4 && (h < 12 || h > 14) ? "раунда" : "раундов";
  }

  function renderTrends() {
    const m = marketData(), rep = m && m.report, box = $("#marketBlock");
    if (!rep || !rep.sectors) { box.innerHTML = `<div class="empty">${esc(mk("empty"))}</div>`; return; }
    const W = Math.max(280, Math.min(box.clientWidth || 340, 640));
    const am = rep.all_money || {}, fd = rep.formd, win = rep.window_days || 14;
    const d = (a, b) => (b ? `<small>${a >= b ? "▲" : "▼"} ${Math.abs(Math.round((a - b) / b * 100))}%</small>` : "");
    const early = am.cur_n ? Math.round((am.cur_early || 0) / am.cur_n * 100) : 0;
    const kpis = [
      `<div class="kpi"><b>${am.cur_n || 0} ${d(am.cur_n, am.prev_n)}</b><span>${esc(mk("rounds", win))}</span></div>`,
      `<div class="kpi"><b>${usdS(am.cur_usd)} ${d(am.cur_usd, am.prev_usd)}</b><span>${esc(mk("money"))}</span></div>`,
      `<div class="kpi"><b>${early}%</b><span>${esc(mk("early"))}</span></div>`,
      fd && fd.cur_n ? `<div class="kpi"><b>${fd.cur_n} ${d(fd.cur_n, fd.prev_n)}</b><span>${esc(mk("sec"))}</span></div>`
        : rep.physical ? `<div class="kpi"><b>${rep.physical.share}%</b><span>${esc(mk("phys"))} ${esc(rep.physical.batch)}</span></div>` : "",
    ].join("");
    const names = rep.niche_names || {};
    const niches = (rep.niches || []).filter((n) => n.n >= 2).slice(0, 6);
    const GAPI = { free: "🟢", partly: "🟡", crowded: "🔴" };
    const mine = new Set((state.prefs && state.prefs.niches) || []);
    const nicheCards = niches.map((n) => {
      const meta = sectorList().find((z) => z.id === n.sector) || { emoji: "" };
      const reg = (n.companies || []).filter((r) => !(r.usd >= 1e9));
      const who = reg.slice(0, 3).map((r) => `<a href="${esc(r.url || "")}" data-ext>${esc(r.company)}</a>${r.usd ? " " + usdS(r.usd) : ""}`).join(" · ");
      const mega = (n.mega || [])[0];
      const g = n.gap, p0 = (n.pain || [])[0];
      const gap = g && (g.kz || g.cis) ? `<div class="row"><span>${GAPI[g.kz] || "⚪"} ${esc(mk("kz"))}: ${esc(mk(g.kz) || "?")}</span><span>${GAPI[g.cis] || "⚪"} ${esc(mk("cis"))}: ${esc(mk(g.cis) || "?")}</span>
          ${(g.analogs || []).slice(0, 3).map((x) => `<a href="${esc(x.url)}" data-ext>${esc(x.name)}</a>`).join(" · ")}</div>` : "";
      const on = mine.has(n.niche);
      return `<div class="niche"><div class="top"><b>${meta.emoji} ${esc(state.lang === "en" ? n.niche : names[n.niche] || n.niche)}</b>
        <em>${n.n} <small>${esc(roundsWord(n.n))}</small></em></div>
        <div class="stack" style="height:8px" data-tip="${esc(`${mk("n_early")}: ${n.early} / ${n.n}`)}"><i style="flex:${n.early};background:var(--s1)"></i><i style="flex:${n.n - n.early};background:var(--s-other)"></i></div>
        <div class="who"><b>${esc(mk("n_early"))}: ${n.early} (${Math.round(n.early / n.n * 100)}%)</b> · ${usdS(n.usd)} · ${who}${mega ? ` · ${esc(mk("mega"))} <a href="${esc(mega.url || "")}" data-ext>${esc(mega.company)}</a> ${usdS(mega.usd)}` : ""}</div>
        ${(n.weekly || []).some((x) => x) ? `<div class="spark" data-tip="${esc(mk("trend6"))}: ${esc(n.weekly.join(" · "))}">${spark(n.weekly)}</div>` : ""}
        ${(n.investors || []).length ? `<div class="row">💼 ${esc(mk("investors"))}: ${esc(n.investors.join(", "))}</div>` : ""}
        ${p0 ? `<div class="row">🙋 ${esc(mk("pain"))}: <a href="${esc(p0.url || "")}" data-ext>«${esc(String(p0.text || "").slice(0, 110))}»</a></div>` : ""}
        ${gap}
        <button class="follow${on ? " on" : ""}" data-follow="${esc(n.niche)}">${esc(mk(on ? "following" : "follow"))}</button></div>`;
    }).join("");
    const daily = am.daily || [], wk = am.weekly;
    box.innerHTML = `<div class="mk">
      <div class="kpis">${kpis}</div>
      ${nicheCards ? `<h2>${esc(mk("niches"))}</h2><div class="sub">${esc(mk("niches_s", rep.niche_days || 28))}</div><div class="niches">${nicheCards}</div>` : ""}
      ${wk && wk.total.some((x) => x) ? `<h2>${esc(mk("by_week"))}</h2><div class="sub">${esc(mk("by_week_s"))}</div><div class="chart" id="mkWeek">${weeklyChart(wk, W)}</div>`
        : daily.length ? `<h2>${esc(mk("by_day"))}</h2><div class="sub">${esc(mk("by_day_s"))}</div><div class="chart" id="mkDaily">${dailyChart(daily, W)}</div>` : ""}
      <h2>${esc(mk("sectors"))}</h2><div class="sub">${esc(mk("sectors_s", win))}</div><div class="chart" id="mkSec">${sectorChart(rep, W)}</div>
      ${am.stages ? `<h2>${esc(mk("stages"))}</h2><div class="sub">${esc(mk("stages_s"))}</div><div class="chart" id="mkStage">${stageBar(am.stages)}</div>` : ""}
      ${rep.physical ? `<h2>${esc(mk("phys_t"))}</h2><div class="sub">${esc(mk("phys_s"))}</div><div class="chart" id="mkPhys">${physChart(rep.physical.history, W)}</div>` : ""}
    </div>`;
    for (const id of ["mkDaily", "mkWeek", "mkSec", "mkStage", "mkPhys"]) { const el = document.getElementById(id); if (el) withTip(el); }
    box.querySelectorAll(".niche").forEach((el) => withTip(el));
  }

  function drawDaily(daily) {
    const box = $("#daily"), tip = $("#tip");
    [...box.querySelectorAll("svg")].forEach((s) => s.remove());
    if (!daily || !daily.days || !daily.days.length) { $("#legend").innerHTML = ""; return; }
    const keys = [...daily.leaders, "other"];
    const label = (k) => (k === "other" ? tr("other") : topicName(k));
    const color = (k, i) => k === "other" ? "var(--s-other)" : `var(--s${i + 1})`;
    const totals = keys.map((k) => daily.series[k].reduce((a, b) => a + b, 0));
    $("#legend").innerHTML = keys.map((k, i) => `<span><i style="background:${color(k, i)}"></i>${esc(label(k))} ${totals[i]}</span>`).join("");
    const W = Math.max(280, box.clientWidth || 320), H = 150, pad = { l: 24, r: 4, t: 8, b: 20 };
    const n = daily.days.length, stack = daily.days.map((_, j) => keys.reduce((a, k) => a + daily.series[k][j], 0));
    const max = Math.max(1, ...stack), step = (W - pad.l - pad.r) / n, bw = Math.max(6, step - 4);
    const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / max);
    let svg = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(tr("by_day"))}">`;
    for (const g of [0, 0.5, 1]) {
      const v = Math.round(max * g), yy = y(v);
      svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad.l - 4}" y="${yy + 4}" font-size="10" text-anchor="end" fill="var(--hint)">${v}</text>`;
    }
    daily.days.forEach((day, j) => {
      const x = pad.l + j * step + (step - bw) / 2;
      let base = 0;
      keys.forEach((k, i) => {
        const v = daily.series[k][j];
        if (!v) return;
        const y0 = y(base), y1 = y(base + v), top = base + v === stack[j];
        // 2px зазор цвета фона между сегментами; скругление только у верха столбца.
        svg += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - 2)}" rx="${top ? 3 : 0}" fill="${color(k, i)}"/>`;
        base += v;
      });
      // Подписи отсчитываются от ПОСЛЕДНЕГО дня с равным шагом: иначе
      // последняя подпись садилась вплотную к очередной периодической и
      // они сливались в «25.0926.09» (замечено на первой отрисовке).
      if ((n - 1 - j) % Math.ceil(n / 6) === 0)
        svg += `<text x="${x + bw / 2}" y="${H - 5}" font-size="10" text-anchor="middle" fill="var(--hint)">${day.slice(8)}.${day.slice(5, 7)}</text>`;
      // Зона касания шире столбца — по всей высоте и ширине шага.
      svg += `<rect class="hit" data-j="${j}" x="${pad.l + j * step}" y="0" width="${step}" height="${H - pad.b}" fill="transparent"/>`;
    });
    svg += "</svg>";
    box.insertAdjacentHTML("beforeend", svg);
    const show = (e) => {
      const t = e.target.closest(".hit"); if (!t) { tip.style.display = "none"; return; }
      const j = +t.dataset.j, day = daily.days[j];
      tip.innerHTML = `<b>${day.slice(8)}.${day.slice(5, 7)}</b> · ${stack[j]}<br>` + keys.map((k) => `${esc(label(k))}: ${daily.series[k][j]}`).join("<br>");
      tip.style.left = (+t.getAttribute("x") + step / 2) + "px"; tip.style.top = "8px"; tip.style.display = "block";
    };
    box.querySelector("svg").addEventListener("pointermove", show);
    box.querySelector("svg").addEventListener("pointerdown", show);
    box.querySelector("svg").addEventListener("pointerleave", () => (tip.style.display = "none"));
    $("#dailyTable").innerHTML = `<table><tr><th>${esc(tr("day_col"))}</th>${keys.map((k) => `<th>${esc(label(k))}</th>`).join("")}<th>${esc(tr("total_col"))}</th></tr>` +
      daily.days.map((day, j) => `<tr><td>${day.slice(8)}.${day.slice(5, 7)}</td>${keys.map((k) => `<td>${daily.series[k][j]}</td>`).join("")}<td>${stack[j]}</td></tr>`).join("") + "</table>";
  }

  function drawShare(st) {
    if (!st || !st.volume || !st.volume.length) { $("#share").innerHTML = `<div class="note">${esc(tr("topics_pending"))}</div>`; return; }
    const max = Math.max(...st.volume.map((v) => v.cur));
    $("#share").innerHTML = st.volume.map((v) => `<div class="bar" data-cat="${esc(v.topic)}">
      <span>${esc(topicName(v.topic))}</span><div class="track"><div class="fill" style="width:${(100 * v.cur / max).toFixed(1)}%"></div></div>
      <span class="val">${v.cur} · ${Math.round(v.share)}%</span></div>`).join("");
  }

  // --- навигация -----------------------------------------------------------
  function render() {
    if (state.tab === "feed") renderFeed();
    if (state.tab === "trends") renderTrends();
    if (state.tab === "saved") renderSaved();
    if (state.tab === "settings") renderSettings();
  }
  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    for (const id of ["feed", "trends", "saved", "settings"]) $("#" + id).hidden = id !== tab;
    $("#hdr").hidden = tab !== "feed";
    render();
    scrollTo(0, 0);
  }
  document.querySelector("nav").onclick = (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); };
  $("#cats").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; state.cat = c.dataset.cat || null; renderFeed(); };
  for (const [id, key, cast] of [["#sort", "sort", String], ["#win", "win", Number]]) {
    $(id).onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      state[key] = cast(b.dataset.v);
      $(id).querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      renderFeed();
    };
  }
  $("#aud").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.aud = state.aud === b.dataset.v ? "" : b.dataset.v;
    $("#aud").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === state.aud));
    haptic("select");
    renderFeed();
  };
  document.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) {
      const id = +card.dataset.id;
      const f = (state.data.findings || []).find((x) => x.id === id) || state.fav.get(id);
      if (f) openItem(f);
      return;
    }
    const cat = e.target.closest("[data-cat]");
    if (cat && !cat.classList.contains("chip") && state.tab === "trends") {
      state.cat = cat.dataset.cat; state.win = 168;
      $("#win").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === "168"));
      setTab("feed");
      return;
    }
    const a = e.target.closest("a[data-ext]");
    if (a) { e.preventDefault(); tg && tg.openLink ? tg.openLink(a.href) : open(a.href, "_blank"); return; }
    // 🔔 Следить за нишей: новые раунды в ней придут сообщением в чат.
    const nf = e.target.closest("[data-follow]");
    if (nf && state.prefs) {
      const k = nf.dataset.follow, list = new Set(state.prefs.niches || []);
      if (list.has(k)) list.delete(k); else list.add(k);
      state.prefs.niches = [...list];
      savePrefs(true);
      haptic("light");
      renderTrends();
    }
  });
  $("#tableToggle").onclick = () => {
    const t = $("#dailyTable"), b = $("#tableToggle");
    t.hidden = !t.hidden;
    b.dataset.t = t.hidden ? "table_show" : "table_hide";
    b.textContent = tr(b.dataset.t);
  };

  (async () => {
    setLang(guessLang());
    try {
      const [data, prefs] = await Promise.all([api("/api/data"), api("/api/prefs")]);
      state.data = data;
      state.prefs = normPrefs(prefs);
      await loadFav();
      if (state.prefs.lang) setLang(state.prefs.lang);
      setTab("feed");
      if (!state.prefs.lang) $("#gate").hidden = false;
    } catch (e) {
      $("#feed").innerHTML = `<div class="empty">${esc(tr(e.message === "auth" ? "no_access" : "load_err"))}</div>`;
    }
  })();
})();
</script>
</body>
</html>
